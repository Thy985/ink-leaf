name: Web 回归

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 网页回归 (ubuntu-latest + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:web
      - run: python3 -m pip install -r tests/web/requirements.txt
      # 依赖安装偶发失败：ubuntu-latest 镜像升级后，apt 源（例如 packages.microsoft.com
      # 尚未为新发行版生成 InRelease）会瞬时失效，而 playwright 的 --with-deps 依赖 apt，
      # 表现为整个 job 红掉。这里重试 3 次，把「跑不起来」和「真的有问题」区分开。
      # 不改用 --without-deps：那会让 headless Chromium 缺系统库，变成另一种假红。
      - name: 安装 Chromium
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "== playwright install (attempt $attempt/3) =="
            if python3 -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "playwright install failed after 3 attempts"
          exit 1

      # 测试脚本自身会探测 4173 端口，探测不到才会另起服务；
      # 这里先起一个，保证 smoke / advanced / controls 这类不自带服务器的用例能跑。
      - name: 运行网页回归
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/
          for test in smoke advanced controls v04 v05 v06 v07 v08 v09 issues_16_30 mobile; do
            echo "== tests/web/${test}_test.py =="
            python3 "tests/web/${test}_test.py"
          done

      - name: 归档测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results/web/
          if-no-files-found: ignore
          retention-days: 14
