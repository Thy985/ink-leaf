plugins { id 'com.android.application' }

android { namespace 'com.inkleaf.android'; compileSdk 35
    defaultConfig { applicationId 'com.inkleaf.android'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.9.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // Align transitive jdk7/jdk8 artifacts with the merged Kotlin stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
